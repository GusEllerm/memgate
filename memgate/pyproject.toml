[project]
name = "memgate"
version = "0.1.0"
description = "Permission layer for agent memory: context-scoped labels, Cedar policies, and adapters for memory systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cedarpy==4.12.1"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
