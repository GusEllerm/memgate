[project]
name = "memgate"
version = "0.3.1"
description = "Permission layer for agent memory: context-scoped labels, Cedar policies, and adapters for memory systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cedarpy==4.12.1"]

[project.optional-dependencies]
# The memory store memgate ships an adapter for, and the version its validator is tested against.
hindsight = ["hindsight-api==0.10.1", "hindsight-client==0.10.1"]
# The async client (AsyncHindsightMemory).
async = ["httpx>=0.27"]

[project.scripts]
memgate = "memgate.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
