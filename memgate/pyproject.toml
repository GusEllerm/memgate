[project]
name = "memgate"
version = "0.8.2"
description = "Permission layer for agent memory: context-scoped labels, Cedar policies, and adapters for memory systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cedarpy==4.12.1"]

[project.optional-dependencies]
# The memory store memgate ships an adapter for, and the version its validator is tested against.
# Hindsight is published as hindsight-api-slim (the base, no torch) and hindsight-api (a meta-package: the slim
# one with every model extra, torch included). `hindsight` is the full install, for --embeddings-provider local and
# --reranker local; `hindsight-slim` is torch-free, for --embeddings-provider onnx|openai with --reranker flashrank|rrf
# (Hindsight's local-onnx extra is onnxruntime and the tokenizer; flashrank is the reranker). Both carry the embedded
# Postgres; the full one keeps the onnx packages, so a full install still runs every provider. `memgate serve` checks at start that the chosen providers' packages are importable and names the extra.
hindsight = ["hindsight-api-slim[local-ml,local-onnx,embedded-db]==0.10.1", "hindsight-client==0.10.1"]
hindsight-slim = ["hindsight-api-slim[local-onnx,embedded-db]==0.10.1", "hindsight-client==0.10.1", "flashrank>=0.2.0"]
async = ["httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]
mem0 = ["mem0ai>=2.2"]

[project.scripts]
memgate = "memgate.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
