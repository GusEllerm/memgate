[project]
name = "smbench"
version = "0.1.0"
description = "Benchmarks for selective (context-locked) agent memory: leakage, retelling, permitted recall, efficacy and speed."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "globus-sdk>=3.50",
]

[project.scripts]
smbench-gateway = "smbench.alcf.gateway:main"
smbench-alcf-auth = "smbench.alcf.auth:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
